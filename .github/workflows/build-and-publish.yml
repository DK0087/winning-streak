name: Build & Publish

# On every push to main:
#  1. build a SIGNED release APK (same key forever, so updates install over the old app)
#  2. attach WinningStreak.apk to a GitHub Release
#  3. deploy www/ as an installable PWA on GitHub Pages, with a public APK download page
#
# One-time setup to produce the signed APK: add two repo secrets
#   ANDROID_KEYSTORE_BASE64      (base64 of the release keystore)
#   ANDROID_KEYSTORE_PASSWORD    (the keystore/key password)
# Until they are set, CI still passes and the PWA still deploys; it just skips the signed Release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # create Releases
  pages: write      # deploy GitHub Pages
  id-token: write   # Pages deployment OIDC

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/dev/null 2>&1 || true

      - name: Install JS deps and sync Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Prepare signing key
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "WS_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "WS_KEY_ALIAS=winningstreak" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Keystore present - building a signed release."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secret set - building a debug-signed APK and skipping the Release. Add the secrets to publish the installable signed app."
          fi

      - name: Build release APK
        working-directory: android
        env:
          WS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WS_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PwsVersionCode=${{ github.run_number }} \
            -PwsVersionName=1.0.${{ github.run_number }}

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk WinningStreak.apk
          ls -la WinningStreak.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinningStreak-apk
          path: WinningStreak.apk

      - name: Publish signed Release
        if: steps.sign.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Winning Streak v1.0.${{ github.run_number }}
          make_latest: true
          files: WinningStreak.apk
          body: |
            **Winning Streak** - nightly ritual app for Android.

            Download **WinningStreak.apk** below and open it on your phone.
            Updates install straight over the previous version (same signing key).

  pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: WinningStreak-apk
          path: apk

      - name: Assemble site (PWA + download page + APK)
        run: |
          mkdir -p site
          cp -r www/* site/
          if [ "${{ needs.build.outputs.signed }}" = "true" ] && [ -f apk/WinningStreak.apk ]; then
            cp apk/WinningStreak.apk site/WinningStreak.apk
            echo "Included signed APK in the Pages site."
          else
            echo "No signed APK yet - PWA deploys without the direct APK download."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
